<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Normal Distribution Visual Practice</title>
<style>
:root{
  --bg:#f6f7fb; --card:#ffffff; --text:#1f2937; --muted:#667085; --line:#d8dde8;
  --accent:#315ea8; --good:#176b3a; --bad:#a52828;
}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text);line-height:1.45}
.wrap{max-width:1050px;margin:0 auto;padding:20px}
h1{font-size:clamp(1.55rem,4vw,2.1rem);margin:0 0 6px}
.sub{color:var(--muted);margin:0 0 16px}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.tab{border:0;border-radius:9px;padding:10px 14px;font-weight:700;cursor:pointer;background:#e9edf4;color:#263142}
.tab.active{background:var(--accent);color:white}
.grid{display:grid;grid-template-columns:1fr 1.05fr;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
label{display:block;font-weight:700;font-size:.9rem;margin-bottom:5px}
input{width:100%;padding:10px 11px;border:1px solid #b8c0cf;border-radius:9px;font:inherit}
.note{color:var(--muted);font-size:.9rem}
.task{font-size:1.08rem;margin:16px 0 12px}
.answer-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end}
button{font:inherit;border:0;border-radius:9px;padding:11px 14px;cursor:pointer;font-weight:700}
.primary{background:var(--accent);color:white}
.secondary{background:#e9edf4;color:#263142}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.feedback{min-height:24px;margin-top:10px;font-weight:700}
.good{color:var(--good)} .bad{color:var(--bad)}
.solution{display:none;margin-top:12px;padding:12px;border-radius:10px;background:#f8fafc;border:1px solid var(--line)}
.code{font-family:Consolas,monospace;background:#eef1f5;padding:2px 5px;border-radius:4px}
canvas{width:100%;height:380px;border:1px solid var(--line);border-radius:10px;background:white}
.graph-caption{margin-top:8px;color:var(--muted);font-size:.92rem}
.concept{margin-top:12px;padding:10px 12px;border-left:4px solid var(--accent);background:#f7f9fc}
@media(max-width:800px){.grid{grid-template-columns:1fr}.controls{grid-template-columns:1fr 1fr}}
@media(max-width:500px){.controls{grid-template-columns:1fr}.answer-row{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Normal Distribution – Visual Practice</h1>
  <p class="sub">Change the parameters and watch how the normal curve, the shaded area, and the required Excel calculation change.</p>

  <div class="tabs">
    <button class="tab active" data-page="true">NORM.DIST – TRUE</button>
    <button class="tab" data-page="false">NORM.DIST – FALSE</button>
    <button class="tab" data-page="inv">NORM.INV</button>
  </div>

  <div class="grid">
    <section class="card">
      <div class="controls" id="controls"></div>
      <p class="note" id="inputNote"></p>

      <div class="task" id="taskText"></div>

      <div class="answer-row">
        <div>
          <label for="answer">Your answer</label>
          <input id="answer" type="number" step="any" placeholder="Enter your result">
        </div>
        <button class="primary" id="check">Check</button>
      </div>

      <div class="feedback" id="feedback" aria-live="polite"></div>

      <div class="actions">
        <button class="secondary" id="newValues">New values</button>
        <button class="secondary" id="showSolution">Show solution</button>
      </div>

      <div class="solution" id="solution"></div>
      <div class="concept" id="concept"></div>
    </section>

    <section class="card">
      <canvas id="chart" width="800" height="470" aria-label="Normal distribution graph"></canvas>
      <div class="graph-caption" id="graphCaption"></div>
    </section>
  </div>
</div>

<script>
let page="true";
const $=id=>document.getElementById(id);

function erf(x){
  const s=x<0?-1:1; x=Math.abs(x);
  const a1=.254829592,a2=-.284496736,a3=1.421413741,a4=-1.453152027,a5=1.061405429,p=.3275911;
  const t=1/(1+p*x);
  return s*(1-(((((a5*t+a4)*t)+a3)*t+a2)*t+a1)*t*Math.exp(-x*x));
}
function cdf(z){return .5*(1+erf(z/Math.SQRT2))}
function pdf(x,mu,s){const z=(x-mu)/s; return Math.exp(-.5*z*z)/(s*Math.sqrt(2*Math.PI))}
function invNorm(p){
  const a=[-39.6968302866538,220.946098424521,-275.928510446969,138.357751867269,-30.6647980661472,2.50662827745924];
  const b=[-54.4760987982241,161.585836858041,-155.698979859887,66.8013118877197,-13.2806815528857];
  const c=[-.00778489400243029,-.322396458041136,-2.40075827716184,-2.54973253934373,4.37466414146497,2.93816398269878];
  const d=[.00778469570904146,.32246712907004,2.445134137143,3.75440866190742];
  let q,r;
  if(p<.02425){q=Math.sqrt(-2*Math.log(p));return (((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1)}
  if(p>.97575){q=Math.sqrt(-2*Math.log(1-p));return -(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1)}
  q=p-.5;r=q*q;
  return (((((a[0]*r+a[1])*r+a[2])*r+a[3])*r+a[4])*r+a[5])*q/(((((b[0]*r+b[1])*r+b[2])*r+b[3])*r+b[4])*r+1)
}
function pct(v){return (100*v).toFixed(2).replace(/\.00$/,"")+"%"}
function num(v){return Number(v).toFixed(4)}

function state(){
  return {
    mu:+$("mu").value,
    sigma:+$("sigma").value,
    x:$("x")?+$("x").value:null,
    p:$("p")?+$("p").value:null
  };
}

function renderControls(){
  if(page==="inv"){
    $("controls").innerHTML=`
      <div><label>Mean (μ)</label><input id="mu" type="number" step="0.01" value="0.08"></div>
      <div><label>Std. dev. (σ)</label><input id="sigma" type="number" step="0.01" min="0.001" value="0.20"></div>
      <div><label>Left-tail probability</label><input id="p" type="number" step="0.01" min="0.001" max="0.999" value="0.05"></div>`;
    $("inputNote").textContent="Enter probabilities as decimals: 5% = 0.05.";
  } else {
    $("controls").innerHTML=`
      <div><label>Mean (μ)</label><input id="mu" type="number" step="0.01" value="0.08"></div>
      <div><label>Std. dev. (σ)</label><input id="sigma" type="number" step="0.01" min="0.001" value="0.20"></div>
      <div><label>Return (x)</label><input id="x" type="number" step="0.01" value="0.05"></div>`;
    $("inputNote").textContent="Enter returns as decimals: 8% = 0.08, 20% = 0.20.";
  }
  [...$("controls").querySelectorAll("input")].forEach(el=>el.addEventListener("input",update));
}

function result(){
  const v=state();
  if(page==="true") return cdf((v.x-v.mu)/v.sigma);
  if(page==="false") return pdf(v.x,v.mu,v.sigma);
  return v.mu+v.sigma*invNorm(v.p);
}

function taskText(){
  const v=state();
  if(page==="true")
    return `A stock return is normally distributed with an expected return of ${pct(v.mu)} and a standard deviation of ${pct(v.sigma)}. What is the probability that the return will be lower than ${pct(v.x)}?`;
  if(page==="false")
    return `A stock return is normally distributed with an expected return of ${pct(v.mu)} and a standard deviation of ${pct(v.sigma)}. What is the height of the normal density curve at a return of ${pct(v.x)}?`;
  return `A stock return is normally distributed with an expected return of ${pct(v.mu)} and a standard deviation of ${pct(v.sigma)}. Find the return below which ${(100*v.p).toFixed(1)}% of possible returns are expected to fall.`;
}

function excelFormula(){
  const v=state();
  if(page==="true") return `=NORM.DIST(${v.x},${v.mu},${v.sigma},TRUE)`;
  if(page==="false") return `=NORM.DIST(${v.x},${v.mu},${v.sigma},FALSE)`;
  return `=NORM.INV(${v.p},${v.mu},${v.sigma})`;
}

function update(){
  const v=state();
  if(!(v.sigma>0) || (page==="inv" && !(v.p>0&&v.p<1))){
    $("feedback").className="feedback bad";
    $("feedback").textContent="Check the input values.";
    return;
  }
  $("taskText").textContent=taskText();
  $("answer").value="";
  $("feedback").textContent="";
  $("solution").style.display="none";

  if(page==="true"){
    $("concept").innerHTML="<strong>What are we looking for?</strong> An <strong>area under the density curve</strong>: the probability to the left of the given return.";
  } else if(page==="false"){
    $("concept").innerHTML="<strong>What are we looking for?</strong> The <strong>height of the density curve</strong> at one particular return. This is not an area and not a probability.";
  } else {
    $("concept").innerHTML="<strong>What are we looking for?</strong> A <strong>return on the horizontal axis</strong> that leaves the given probability as an area under the curve to its left.";
  }
  draw();
}

function check(){
  const u=parseFloat($("answer").value);
  if(!Number.isFinite(u)){
    $("feedback").className="feedback bad";
    $("feedback").textContent="Enter a numerical answer.";
    return;
  }
  const r=result();
  const tol=Math.max(0.0006,Math.abs(r)*0.005);
  if(Math.abs(u-r)<=tol){
    $("feedback").className="feedback good";
    $("feedback").textContent="Correct.";
  }else{
    $("feedback").className="feedback bad";
    $("feedback").textContent="Not quite. Use the graph to decide whether the task asks for an area, a curve height, or a return value.";
  }
}

function showSolution(){
  const r=result();
  let interpretation="";
  if(page==="true") interpretation=`Probability = ${(100*r).toFixed(2)}%`;
  if(page==="false") interpretation=`Density height = ${r.toFixed(4)}`;
  if(page==="inv") interpretation=`Return = ${pct(r)}`;
  $("solution").innerHTML=`<strong>Solution:</strong> ${interpretation}<br><strong>Excel:</strong> <span class="code">${excelFormula()}</span>`;
  $("solution").style.display="block";
}

function randomize(){
  const mu=(Math.floor(Math.random()*15)-3)/100;
  const sigma=(Math.floor(Math.random()*18)+5)/100;
  $("mu").value=mu.toFixed(2);
  $("sigma").value=sigma.toFixed(2);
  if(page==="inv"){
    const probs=[.01,.025,.05,.10,.20,.80,.90,.95,.975,.99];
    $("p").value=probs[Math.floor(Math.random()*probs.length)];
  }else{
    const x=mu+sigma*((Math.floor(Math.random()*25)-12)/10);
    $("x").value=x.toFixed(3);
  }
  update();
}

function draw(){
  const c=$("chart"), ctx=c.getContext("2d"), v=state();
  const W=c.width,H=c.height,pad={l:70,r:24,t:28,b:62};
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle="#fff";ctx.fillRect(0,0,W,H);

  const lo=v.mu-4*v.sigma, hi=v.mu+4*v.sigma;
  const peak=pdf(v.mu,v.mu,v.sigma);
  const ymax=peak*1.18;
  const X=x=>pad.l+(x-lo)/(hi-lo)*(W-pad.l-pad.r);
  const Y=y=>H-pad.b-y/ymax*(H-pad.t-pad.b);

  // axes
  ctx.strokeStyle="#344054";ctx.lineWidth=1.5;
  ctx.beginPath();
  ctx.moveTo(pad.l,pad.t);ctx.lineTo(pad.l,H-pad.b);ctx.lineTo(W-pad.r,H-pad.b);ctx.stroke();

  // labels
  ctx.fillStyle="#344054";ctx.font="14px Arial";
  ctx.textAlign="center";ctx.fillText("Return",W-pad.r-30,H-18);
  ctx.save();ctx.translate(18,(pad.t+H-pad.b)/2);ctx.rotate(-Math.PI/2);ctx.fillText("Density f(x)",0,0);ctx.restore();

  // dynamic axis labels: mean and task-specific point
  const labels=[{x:v.mu,text:"μ = "+pct(v.mu)}];
  let markX;
  if(page==="inv") markX=result(); else markX=v.x;
  if(Math.abs(markX-v.mu)>v.sigma*0.08) labels.push({x:markX,text:(page==="inv"?"x* = ":"x = ")+pct(markX)});

  ctx.font="13px Arial";ctx.fillStyle="#475467";
  labels.forEach(o=>{
    ctx.strokeStyle="#344054";ctx.beginPath();ctx.moveTo(X(o.x),H-pad.b-5);ctx.lineTo(X(o.x),H-pad.b+5);ctx.stroke();
    ctx.textAlign="center";ctx.fillText(o.text,X(o.x),H-pad.b+24);
  });

  // y-axis labels: zero and peak
  ctx.textAlign="right";ctx.fillText("0",pad.l-10,H-pad.b+4);
  ctx.beginPath();ctx.moveTo(pad.l-5,Y(peak));ctx.lineTo(pad.l+5,Y(peak));ctx.stroke();
  ctx.fillText("peak = "+peak.toFixed(2),pad.l-10,Y(peak)+4);

  // shade area for TRUE and INV
  if(page==="true" || page==="inv"){
    const cutoff=markX;
    ctx.fillStyle="rgba(49,94,168,.20)";
    ctx.beginPath();
    ctx.moveTo(X(lo),Y(0));
    for(let i=0;i<=500;i++){
      const x=lo+(hi-lo)*i/500;
      if(x>cutoff) break;
      ctx.lineTo(X(x),Y(pdf(x,v.mu,v.sigma)));
    }
    ctx.lineTo(X(Math.min(cutoff,hi)),Y(0));
    ctx.closePath();ctx.fill();
  }

  // density curve
  ctx.strokeStyle="#315ea8";ctx.lineWidth=3;
  ctx.beginPath();
  for(let i=0;i<=600;i++){
    const x=lo+(hi-lo)*i/600;
    const y=pdf(x,v.mu,v.sigma);
    if(i===0)ctx.moveTo(X(x),Y(y));else ctx.lineTo(X(x),Y(y));
  }
  ctx.stroke();

  // task marker
  const ymark=pdf(markX,v.mu,v.sigma);
  ctx.setLineDash([6,4]);ctx.strokeStyle="#9a3f4d";ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(X(markX),H-pad.b);ctx.lineTo(X(markX),Y(ymark));ctx.stroke();
  ctx.setLineDash([]);

  if(page==="false"){
    ctx.fillStyle="#9a3f4d";ctx.beginPath();ctx.arc(X(markX),Y(ymark),5,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle="#9a3f4d";ctx.setLineDash([5,4]);
    ctx.beginPath();ctx.moveTo(pad.l,Y(ymark));ctx.lineTo(X(markX),Y(ymark));ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle="#9a3f4d";ctx.font="bold 13px Arial";ctx.textAlign="right";
    ctx.fillText("f(x) = "+ymark.toFixed(3),pad.l-10,Y(ymark)+4);
  }

  // title/caption
  ctx.fillStyle="#101828";ctx.font="bold 16px Arial";ctx.textAlign="left";
  ctx.fillText(`Normal density: μ = ${pct(v.mu)}, σ = ${pct(v.sigma)}`,pad.l+6,pad.t+4);

  if(page==="true"){
    $("graphCaption").textContent="The shaded region is the probability that the return is below x. Changing μ shifts the curve; changing σ changes its spread and height.";
  }else if(page==="false"){
    $("graphCaption").textContent="The red point shows the height of the density curve at x. A larger σ makes the curve wider and lower; changing μ shifts the whole curve.";
  }else{
    $("graphCaption").textContent="The shaded region is the given left-tail probability. NORM.INV finds the return on the horizontal axis where that shaded area ends.";
  }
}

document.querySelectorAll(".tab").forEach(btn=>{
  btn.addEventListener("click",()=>{
    page=btn.dataset.page;
    document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b===btn));
    renderControls();update();
  });
});
$("check").addEventListener("click",check);
$("showSolution").addEventListener("click",showSolution);
$("newValues").addEventListener("click",randomize);

renderControls();
update();
</script>
</body>
</html>
