<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Normal Distribution Visual Practice</title>
<style>
:root{
  --bg:#f6f7fb; --card:#fff; --text:#1f2937; --muted:#667085; --line:#d8dde8;
  --accent:#315ea8; --good:#176b3a; --bad:#a52828;
}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text);line-height:1.45}
.wrap{max-width:1120px;margin:0 auto;padding:20px}
h1{font-size:clamp(1.55rem,4vw,2.1rem);margin:0 0 6px}
.sub{color:var(--muted);margin:0 0 16px}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.tab{border:0;border-radius:9px;padding:10px 14px;font-weight:700;cursor:pointer;background:#e9edf4;color:#263142}
.tab.active{background:var(--accent);color:#fff}
.grid{display:grid;grid-template-columns:.9fr 1.1fr;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.controls{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.controls.three{grid-template-columns:repeat(3,1fr)}
label{display:block;font-weight:700;font-size:.9rem;margin-bottom:5px}
input{width:100%;padding:10px 11px;border:1px solid #b8c0cf;border-radius:9px;font:inherit}
.note{color:var(--muted);font-size:.9rem}
.taskbox{margin-top:16px;padding:14px;border-radius:10px;background:#f8fafc;border:1px solid var(--line)}
.task{font-size:1.06rem;margin:0}
.answer-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end;margin-top:14px}
button{font:inherit;border:0;border-radius:9px;padding:11px 14px;cursor:pointer;font-weight:700}
.primary{background:var(--accent);color:#fff}
.secondary{background:#e9edf4;color:#263142}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.feedback{min-height:24px;margin-top:10px;font-weight:700}
.good{color:var(--good)} .bad{color:var(--bad)}
.solution{display:none;margin-top:12px;padding:12px;border-radius:10px;background:#f8fafc;border:1px solid var(--line)}
.code{font-family:Consolas,monospace;background:#eef1f5;padding:2px 5px;border-radius:4px}
canvas{width:100%;height:420px;border:1px solid var(--line);border-radius:10px;background:#fff}
.graph-caption{margin-top:8px;color:var(--muted);font-size:.92rem}
.concept{margin-top:12px;padding:10px 12px;border-left:4px solid var(--accent);background:#f7f9fc}
@media(max-width:850px){.grid{grid-template-columns:1fr}.controls,.controls.three{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.controls,.controls.three{grid-template-columns:1fr}.answer-row{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Normal Distribution – Visual Practice</h1>
  <p class="sub">Start from the standard normal distribution, enter the task values yourself, and observe how the curve and the relevant probability region change.</p>

  <div class="tabs">
    <button class="tab active" data-page="left">NORM.DIST – below x</button>
    <button class="tab" data-page="density">NORM.DIST – density value</button>
    <button class="tab" data-page="inv">NORM.INV</button>
    <button class="tab" data-page="between">NORM.DIST – between two returns</button>
  </div>

  <div class="grid">
    <section class="card">
      <div id="controls"></div>
      <p class="note">Starting values are μ = 0 and σ = 1 (standard normal distribution). Enter returns as decimals: 5% = 0.05.</p>

      <div class="taskbox">
        <p class="task" id="taskText"></p>
      </div>

      <div class="answer-row">
        <div>
          <label for="answer">Your answer</label>
          <input id="answer" type="number" step="any" placeholder="Enter your result">
        </div>
        <button class="primary" id="check">Check</button>
      </div>

      <div class="feedback" id="feedback" aria-live="polite"></div>

      <div class="actions">
        <button class="secondary" id="reset">Reset to standard normal</button>
        <button class="secondary" id="showSolution">Show solution</button>
      </div>

      <div class="solution" id="solution"></div>
      <div class="concept" id="concept"></div>
    </section>

    <section class="card">
      <canvas id="chart" width="860" height="500" aria-label="Normal distribution graph"></canvas>
      <div class="graph-caption" id="graphCaption"></div>
    </section>
  </div>
</div>

<script>
let page="left";
const $=id=>document.getElementById(id);

function erf(x){
  const s=x<0?-1:1; x=Math.abs(x);
  const a1=.254829592,a2=-.284496736,a3=1.421413741,a4=-1.453152027,a5=1.061405429,p=.3275911;
  const t=1/(1+p*x);
  return s*(1-(((((a5*t+a4)*t)+a3)*t+a2)*t+a1)*t*Math.exp(-x*x));
}
function cdf(z){return .5*(1+erf(z/Math.SQRT2))}
function pdf(x,mu,s){const z=(x-mu)/s;return Math.exp(-.5*z*z)/(s*Math.sqrt(2*Math.PI))}
function invNorm(p){
  const a=[-39.6968302866538,220.946098424521,-275.928510446969,138.357751867269,-30.6647980661472,2.50662827745924];
  const b=[-54.4760987982241,161.585836858041,-155.698979859887,66.8013118877197,-13.2806815528857];
  const c=[-.00778489400243029,-.322396458041136,-2.40075827716184,-2.54973253934373,4.37466414146497,2.93816398269878];
  const d=[.00778469570904146,.32246712907004,2.445134137143,3.75440866190742];
  let q,r;
  if(p<.02425){q=Math.sqrt(-2*Math.log(p));return (((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1)}
  if(p>.97575){q=Math.sqrt(-2*Math.log(1-p));return -(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1)}
  q=p-.5;r=q*q;
  return (((((a[0]*r+a[1])*r+a[2])*r+a[3])*r+a[4])*r+a[5])*q/(((((b[0]*r+b[1])*r+b[2])*r+b[3])*r+b[4])*r+1)
}
function pct(v){return (v*100).toFixed(2).replace(/\.00$/,"")+"%"}

function renderControls(){
  if(page==="inv"){
    $("controls").innerHTML=`
      <div class="controls three">
        <div><label>Mean (μ)</label><input id="mu" type="number" step="0.01" value="0"></div>
        <div><label>Std. dev. (σ)</label><input id="sigma" type="number" step="0.01" min="0.01" value="1"></div>
        <div><label>Left-tail probability</label><input id="p" type="number" step="0.01" min="0.001" max="0.999" value="0.05"></div>
      </div>`;
  }else if(page==="between"){
    $("controls").innerHTML=`
      <div class="controls">
        <div><label>Mean (μ)</label><input id="mu" type="number" step="0.01" value="0"></div>
        <div><label>Std. dev. (σ)</label><input id="sigma" type="number" step="0.01" min="0.01" value="1"></div>
        <div><label>Lower return</label><input id="x1" type="number" step="0.01" value="0.05"></div>
        <div><label>Upper return</label><input id="x2" type="number" step="0.01" value="0.10"></div>
      </div>`;
  }else{
    $("controls").innerHTML=`
      <div class="controls three">
        <div><label>Mean (μ)</label><input id="mu" type="number" step="0.01" value="0"></div>
        <div><label>Std. dev. (σ)</label><input id="sigma" type="number" step="0.01" min="0.01" value="1"></div>
        <div><label>Return (x)</label><input id="x" type="number" step="0.01" value="0.05"></div>
      </div>`;
  }
  $("controls").querySelectorAll("input").forEach(el=>el.addEventListener("input",update));
}

function state(){
  return {
    mu:+$("mu").value,
    sigma:+$("sigma").value,
    x:$("x")?+$("x").value:null,
    x1:$("x1")?+$("x1").value:null,
    x2:$("x2")?+$("x2").value:null,
    p:$("p")?+$("p").value:null
  };
}
function valid(v){
  if(!(v.sigma>0)) return false;
  if(page==="inv" && !(v.p>0&&v.p<1)) return false;
  if(page==="between" && !(v.x1<v.x2)) return false;
  return true;
}

function result(){
  const v=state();
  if(page==="left") return cdf((v.x-v.mu)/v.sigma);
  if(page==="density") return pdf(v.x,v.mu,v.sigma);
  if(page==="inv") return v.mu+v.sigma*invNorm(v.p);
  return cdf((v.x2-v.mu)/v.sigma)-cdf((v.x1-v.mu)/v.sigma);
}

function taskText(){
  const v=state();
  if(page==="left")
    return `A stock return is normally distributed with an expected return of ${pct(v.mu)} and a standard deviation of ${pct(v.sigma)}. What is the probability that the return will be lower than ${pct(v.x)}?`;
  if(page==="density")
    return `A stock return is normally distributed with an expected return of ${pct(v.mu)} and a standard deviation of ${pct(v.sigma)}. Calculate the value of the normal density function at a return of ${pct(v.x)}.`;
  if(page==="inv")
    return `A stock return is normally distributed with an expected return of ${pct(v.mu)} and a standard deviation of ${pct(v.sigma)}. Determine the return below which ${(100*v.p).toFixed(1)}% of possible returns are expected to fall.`;
  return `A stock return is normally distributed with an expected return of ${pct(v.mu)} and a standard deviation of ${pct(v.sigma)}. What is the probability that the return will be between ${pct(v.x1)} and ${pct(v.x2)}?`;
}

function excelFormula(){
  const v=state();
  if(page==="left") return `=NORM.DIST(${v.x},${v.mu},${v.sigma},TRUE)`;
  if(page==="density") return `=NORM.DIST(${v.x},${v.mu},${v.sigma},FALSE)`;
  if(page==="inv") return `=NORM.INV(${v.p},${v.mu},${v.sigma})`;
  return `=NORM.DIST(${v.x2},${v.mu},${v.sigma},TRUE)-NORM.DIST(${v.x1},${v.mu},${v.sigma},TRUE)`;
}

function update(){
  const v=state();
  if(!valid(v)){
    $("feedback").className="feedback bad";
    $("feedback").textContent="Check the input values.";
    return;
  }
  $("taskText").textContent=taskText();
  $("answer").value="";
  $("feedback").textContent="";
  $("solution").style.display="none";

  if(page==="left"){
    $("concept").innerHTML="<strong>Interpretation:</strong> the answer is the <strong>area under the normal density curve to the left of the given return</strong>.";
  }else if(page==="density"){
    $("concept").innerHTML="<strong>Interpretation:</strong> the answer is the <strong>value of the density function at the given return</strong>. It is not an interval probability.";
  }else if(page==="inv"){
    $("concept").innerHTML="<strong>Interpretation:</strong> the probability is given first. The task is to find the <strong>return on the horizontal axis</strong> that leaves this area under the curve to its left.";
  }else{
    $("concept").innerHTML="<strong>Interpretation:</strong> the answer is the <strong>area under the normal density curve between the two given returns</strong>.";
  }
  draw();
}

function check(){
  const u=parseFloat($("answer").value);
  if(!Number.isFinite(u)){
    $("feedback").className="feedback bad";
    $("feedback").textContent="Enter a numerical answer.";
    return;
  }
  const r=result(), tol=Math.max(.0006,Math.abs(r)*.005);
  if(Math.abs(u-r)<=tol){
    $("feedback").className="feedback good";
    $("feedback").textContent="Correct.";
  }else{
    $("feedback").className="feedback bad";
    $("feedback").textContent="Not quite. Use the graph to decide what the requested quantity represents.";
  }
}

function showSolution(){
  const r=result();
  let out="";
  if(page==="left"||page==="between") out=`Probability = ${(100*r).toFixed(2)}%`;
  else if(page==="density") out=`Density function value = ${r.toFixed(4)}`;
  else out=`Return = ${pct(r)}`;
  $("solution").innerHTML=`<strong>Solution:</strong> ${out}<br><strong>Excel:</strong> <span class="code">${excelFormula()}</span>`;
  $("solution").style.display="block";
}

function resetStandard(){
  $("mu").value="0"; $("sigma").value="1";
  if($("x")) $("x").value="0.05";
  if($("p")) $("p").value="0.05";
  if($("x1")) $("x1").value="0.05";
  if($("x2")) $("x2").value="0.10";
  update();
}

function draw(){
  const c=$("chart"),ctx=c.getContext("2d"),v=state();
  const W=c.width,H=c.height,pad={l:74,r:26,t:30,b:62};

  // FIXED coordinate system for every task and every parameter change
  const XMIN=-2.0, XMAX=2.0, YMIN=0, YMAX=2.2;
  const X=x=>pad.l+(x-XMIN)/(XMAX-XMIN)*(W-pad.l-pad.r);
  const Y=y=>H-pad.b-(y-YMIN)/(YMAX-YMIN)*(H-pad.t-pad.b);

  ctx.clearRect(0,0,W,H);
  ctx.fillStyle="#fff";ctx.fillRect(0,0,W,H);

  // grid and fixed ticks
  const xticks=[-2,-1,0,1,2];
  const yticks=[0,0.5,1.0,1.5,2.0];
  ctx.strokeStyle="#e4e7ec";ctx.lineWidth=1;ctx.setLineDash([4,4]);
  xticks.forEach(x=>{ctx.beginPath();ctx.moveTo(X(x),pad.t);ctx.lineTo(X(x),H-pad.b);ctx.stroke()});
  yticks.forEach(y=>{ctx.beginPath();ctx.moveTo(pad.l,Y(y));ctx.lineTo(W-pad.r,Y(y));ctx.stroke()});
  ctx.setLineDash([]);

  // axes
  ctx.strokeStyle="#344054";ctx.lineWidth=1.6;
  ctx.beginPath();ctx.moveTo(pad.l,pad.t);ctx.lineTo(pad.l,H-pad.b);ctx.lineTo(W-pad.r,H-pad.b);ctx.stroke();

  ctx.fillStyle="#475467";ctx.font="13px Arial";
  ctx.textAlign="center";
  xticks.forEach(x=>ctx.fillText(x.toFixed(0),X(x),H-pad.b+22));
  ctx.textAlign="right";
  yticks.forEach(y=>ctx.fillText(y.toFixed(1),pad.l-10,Y(y)+4));

  ctx.fillStyle="#344054";ctx.font="14px Arial";
  ctx.textAlign="center";ctx.fillText("Return / x",W-pad.r-32,H-18);
  ctx.save();ctx.translate(18,(pad.t+H-pad.b)/2);ctx.rotate(-Math.PI/2);ctx.fillText("Density f(x)",0,0);ctx.restore();

  // shaded areas
  function shade(a,b){
    const aa=Math.max(a,XMIN), bb=Math.min(b,XMAX);
    if(!(aa<bb)) return;
    ctx.fillStyle="rgba(49,94,168,.20)";
    ctx.beginPath();ctx.moveTo(X(aa),Y(0));
    for(let i=0;i<=500;i++){
      const x=aa+(bb-aa)*i/500;
      ctx.lineTo(X(x),Y(Math.min(pdf(x,v.mu,v.sigma),YMAX)));
    }
    ctx.lineTo(X(bb),Y(0));ctx.closePath();ctx.fill();
  }

  if(page==="left") shade(XMIN,v.x);
  if(page==="inv") shade(XMIN,result());
  if(page==="between") shade(v.x1,v.x2);

  // density curve changes shape and shifts inside fixed axes
  ctx.strokeStyle="#315ea8";ctx.lineWidth=3;
  ctx.beginPath();
  for(let i=0;i<=700;i++){
    const x=XMIN+(XMAX-XMIN)*i/700;
    const y=Math.min(pdf(x,v.mu,v.sigma),YMAX);
    if(i===0)ctx.moveTo(X(x),Y(y));else ctx.lineTo(X(x),Y(y));
  }
  ctx.stroke();

  // mean line
  if(v.mu>=XMIN&&v.mu<=XMAX){
    ctx.strokeStyle="#98a2b3";ctx.setLineDash([3,4]);
    ctx.beginPath();ctx.moveTo(X(v.mu),H-pad.b);ctx.lineTo(X(v.mu),Y(Math.min(pdf(v.mu,v.mu,v.sigma),YMAX)));ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle="#667085";ctx.font="12px Arial";ctx.textAlign="center";
    ctx.fillText("μ",X(v.mu),H-pad.b+40);
  }

  // relevant markers
  const markers=[];
  if(page==="left"||page==="density") markers.push({x:v.x,label:"x"});
  if(page==="inv") markers.push({x:result(),label:"x*"});
  if(page==="between"){markers.push({x:v.x1,label:"lower"});markers.push({x:v.x2,label:"upper"});}
  markers.forEach(m=>{
    if(m.x<XMIN||m.x>XMAX) return;
    const y=Math.min(pdf(m.x,v.mu,v.sigma),YMAX);
    ctx.strokeStyle="#9a3f4d";ctx.setLineDash([6,4]);ctx.lineWidth=1.4;
    ctx.beginPath();ctx.moveTo(X(m.x),H-pad.b);ctx.lineTo(X(m.x),Y(y));ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle="#9a3f4d";ctx.font="bold 12px Arial";ctx.textAlign="center";
    ctx.fillText(`${m.label}=${m.x.toFixed(2)}`,X(m.x),pad.t+18);
    if(page==="density"){
      ctx.beginPath();ctx.arc(X(m.x),Y(y),5,0,Math.PI*2);ctx.fill();
    }
  });

  ctx.fillStyle="#101828";ctx.font="bold 15px Arial";ctx.textAlign="left";
  ctx.fillText(`Fixed axes | μ = ${v.mu.toFixed(2)}, σ = ${v.sigma.toFixed(2)}`,pad.l+8,pad.t+2);

  if(page==="left"){
    $("graphCaption").textContent="The axes stay fixed. Changing μ shifts the density curve left or right; changing σ changes its width and height. The shaded area is P(R < x).";
  }else if(page==="density"){
    $("graphCaption").textContent="The axes stay fixed. The curve itself moves and changes shape. The marked point shows where the density-function value is evaluated.";
  }else if(page==="inv"){
    $("graphCaption").textContent="The shaded left-tail probability is given. NORM.INV finds the return where that shaded area ends.";
  }else{
    $("graphCaption").textContent="The shaded region is the probability that the return falls between the lower and upper return values.";
  }
}

document.querySelectorAll(".tab").forEach(btn=>{
  btn.addEventListener("click",()=>{
    page=btn.dataset.page;
    document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b===btn));
    renderControls();update();
  });
});
$("check").addEventListener("click",check);
$("showSolution").addEventListener("click",showSolution);
$("reset").addEventListener("click",resetStandard);

renderControls();
update();
</script>
</body>
</html>
